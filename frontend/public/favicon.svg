<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" x2="100%" y1="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="g3" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#14213D"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- White rounded background -->
  <rect fill="#FFFFFF" height="512" rx="128" width="512"/>
  <rect fill="none" height="512" rx="128" stroke="#E2E8F0" stroke-width="2.5" width="512"/>

  <!-- Subtle pulse rings -->
  <circle cx="256" cy="256" fill="none" r="190" stroke="#2563EB" stroke-dasharray="8 8" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="256" cy="256" fill="none" r="150" stroke="#14B8A6" stroke-dasharray="14 10" stroke-opacity="0.25" stroke-width="2"/>

  <!-- Center ambient glow -->
  <circle cx="256" cy="256" fill="#2563EB" filter="url(#glow)" opacity="0.07" r="120"/>

  <!-- Ghost trace -->
  <path d="M 210 140 C 145 140, 110 185, 110 256 C 110 327, 150 372, 220 372 C 280 372, 310 330, 310 295 C 310 260, 275 235, 230 235 C 175 235, 155 285, 195 325"
    fill="none" opacity="0.14" stroke="#2563EB" stroke-linecap="round" stroke-linejoin="round" stroke-width="40"/>

  <!-- C-loop -->
  <path d="M 210 140 C 145 140, 110 185, 110 256 C 110 327, 150 372, 220 372 C 280 372, 310 330, 310 295 C 310 260, 275 235, 230 235 C 175 235, 155 285, 195 325"
    fill="none" stroke="url(#g1)" stroke-linecap="round" stroke-linejoin="round" stroke-width="36"/>

  <!-- K vertical stem -->
  <path d="M 240 135 L 240 375" fill="none" stroke="url(#g3)" stroke-linecap="round" stroke-width="34"/>

  <!-- K upper diagonal -->
  <path d="M 240 256 L 365 145" fill="none" stroke="url(#g2)" stroke-linecap="round" stroke-width="34"/>

  <!-- K lower diagonal -->
  <path d="M 270 230 L 375 365" fill="none" stroke="url(#g1)" stroke-linecap="round" stroke-width="34"/>

  <!-- Nodes -->
  <circle cx="240" cy="135" fill="#2563EB" r="13"/>
  <circle cx="240" cy="135" fill="#FFFFFF" r="6"/>

  <circle cx="365" cy="145" fill="#14B8A6" r="14"/>
  <circle cx="365" cy="145" fill="#FFFFFF" r="7"/>

  <circle cx="375" cy="365" fill="#2563EB" r="13"/>
  <circle cx="375" cy="365" fill="#93C5FD" r="6"/>

  <circle cx="240" cy="375" fill="#14213D" r="13"/>
  <circle cx="240" cy="375" fill="#38BDF8" r="6"/>

  <!-- Nexus core -->
  <circle cx="256" cy="256" fill="#FFFFFF" filter="url(#glow)" r="24"/>
  <circle cx="256" cy="256" fill="#FFFFFF" r="20" stroke="#2563EB" stroke-width="7"/>
  <circle cx="256" cy="256" fill="#14B8A6" r="9"/>
  <circle cx="256" cy="256" fill="#FFFFFF" r="4"/>
</svg>

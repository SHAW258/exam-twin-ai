<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ck-grad-c" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
    <linearGradient id="ck-grad-k-top" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14B8A6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="ck-grad-k-bot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="ck-grad-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#14B8A6" />
    </linearGradient>
  </defs>

  <!-- Deep Navy Rounded Container (#14213D) -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#14213D" />
  <rect x="16" y="16" width="480" height="480" rx="112" stroke="url(#ck-grad-border)" stroke-width="12" stroke-opacity="0.8" />

  <!-- Subtle Inner Guide Rings -->
  <circle cx="256" cy="256" r="180" stroke="#2563EB" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="8 8" />
  <circle cx="256" cy="256" r="140" stroke="#14B8A6" stroke-width="2" stroke-opacity="0.3" stroke-dasharray="12 8" />

  <!-- CodeKnot 'C' Loop Path (Royal Blue to Teal) -->
  <path
    d="M 210 135 C 145 135, 105 180, 105 256 C 105 332, 145 377, 215 377 C 275 377, 305 335, 305 300 C 305 265, 270 240, 225 240 C 175 240, 155 285, 195 325"
    fill="none"
    stroke="url(#ck-grad-c)"
    stroke-width="38"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- CodeKnot 'K' Vertical Stem (Crisp White/Light-Slate) -->
  <path d="M 240 130 L 240 382" fill="none" stroke="#F8FAFC" stroke-width="38" stroke-linecap="round" />

  <!-- CodeKnot 'K' Upper Arm (Teal/Cyan) -->
  <path d="M 240 256 L 370 140" fill="none" stroke="url(#ck-grad-k-top)" stroke-width="38" stroke-linecap="round" />

  <!-- CodeKnot 'K' Lower Arm (Royal Blue) -->
  <path d="M 270 228 L 380 370" fill="none" stroke="url(#ck-grad-k-bot)" stroke-width="38" stroke-linecap="round" />

  <!-- Neural Energy Line on Stem -->
  <line x1="240" y1="170" x2="240" y2="340" stroke="#38BDF8" stroke-width="8" stroke-linecap="round" />

  <!-- Vertex Tech Nodes -->
  <!-- Top-stem node -->
  <circle cx="240" cy="130" r="18" fill="#06B6D4" />
  <circle cx="240" cy="130" r="9" fill="#FFFFFF" />

  <!-- Bottom-stem node -->
  <circle cx="240" cy="382" r="18" fill="#1E3A8A" stroke="#38BDF8" stroke-width="5" />
  <circle cx="240" cy="382" r="8" fill="#FFFFFF" />

  <!-- Top-right arm node -->
  <circle cx="370" cy="140" r="19" fill="#14B8A6" />
  <circle cx="370" cy="140" r="9" fill="#FFFFFF" />

  <!-- Bottom-right arm node -->
  <circle cx="380" cy="370" r="19" fill="#2563EB" />
  <circle cx="380" cy="370" r="9" fill="#93C5FD" />

  <!-- C-curve apex node -->
  <circle cx="105" cy="256" r="15" fill="#14B8A6" />
  <circle cx="105" cy="256" r="7" fill="#FFFFFF" />

  <!-- Living Nexus Core (Central intersection) -->
  <circle cx="256" cy="256" r="28" fill="#14213D" stroke="#2563EB" stroke-width="8" />
  <circle cx="256" cy="256" r="15" fill="#14B8A6" />
  <circle cx="256" cy="256" r="6" fill="#FFFFFF" />
</svg>
